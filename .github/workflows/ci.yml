name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Compile
        run: python -m compileall -q app src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build production API container
        run: docker build -f Dockerfile.api -t airbnb-demand-api:ci .
