name: Production Retrain Template

on:
  workflow_dispatch:
    inputs:
      data_path:
        description: "Path to approved production data staged on the runner"
        required: true
        type: string
      source_version:
        description: "Immutable source-data version or snapshot identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  retrain-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refuse missing production data
        env:
          DATA_PATH: ${{ inputs.data_path }}
        run: |
          test -e "$DATA_PATH" || {
            echo "Approved production data is not staged at $DATA_PATH."
            echo "Synthetic fallback is intentionally disabled for production retraining."
            exit 1
          }
      - name: Run fail-closed training pipeline
        env:
          DATA_PATH: ${{ inputs.data_path }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          python -c "from pathlib import Path; import os; from src.run_pipeline import run_pipeline; run_pipeline(output_dir=Path('outputs'), data_path=os.environ['DATA_PATH'], source_name='production_source', source_version=os.environ['SOURCE_VERSION'])"
      - name: Retention cleanup
        run: python -m src.ops --output-dir outputs --retention-days 30
      - name: Upload candidate outputs
        uses: actions/upload-artifact@v4
        with:
          name: retrain-candidate-${{ inputs.source_version }}
          path: outputs/
